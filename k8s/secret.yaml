apiVersion: v1
kind: Secret
metadata:
  name: oficina-secret
  namespace: oficina
  labels:
    app.kubernetes.io/part-of: fiap-tech-challenge
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production"
  ADMIN_PASSWORD: "change-me-in-production"
  SMTP_USER: "change-me-in-production"
  # MONGODB_URI embeds MONGO_ROOT_USERNAME and MONGO_ROOT_PASSWORD inline.
  # When rotating credentials, update all three keys together to avoid auth drift.
  MONGODB_URI: "mongodb://admin:change-me-in-production@mongo-service.oficina.svc.cluster.local:27017/car-repair-shop?authSource=admin"
  SMTP_PASS: "change-me-in-production"
  MONGO_ROOT_USERNAME: "admin"
  MONGO_ROOT_PASSWORD: "change-me-in-production"
