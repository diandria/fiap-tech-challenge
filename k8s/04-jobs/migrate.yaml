apiVersion: batch/v1
kind: Job
metadata:
  name: car-repair-shop-migrate
  namespace: car-repair-shop
  labels:
    app.kubernetes.io/part-of: fiap-tech-challenge
    app.kubernetes.io/component: migration
spec:
  # Zero, and not the default of 6: a migration that fails must not be re-run
  # automatically. If it failed on a schema conflict, retrying produces the same
  # error; if it failed halfway, retrying can make the state worse.
  backoffLimit: 0
  # The Job removes itself an hour later. Without this, finished Jobs pile up
  # and occupy pod slots in the cluster.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: migrate
        # Replaced at deploy time with the same tag as the application. Running
        # the migration with an image different from the one that will serve
        # means applying a schema the production code may not know about.
        image: car-repair-shop:latest
        command: ["npx", "prisma", "migrate", "deploy"]
        envFrom:
        - secretRef:
            name: car-repair-shop-secret
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
