apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: car-repair-shop-api
  namespace: car-repair-shop
  labels:
    app.kubernetes.io/part-of: fiap-tech-challenge
spec:
  # With minReplicas 2, guaranteeing 1 allows draining one node at a time
  # without taking the whole service down.
  minAvailable: 1
  selector:
    matchLabels:
      app: car-repair-shop-api
