apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: car-repair-shop-api
  namespace: car-repair-shop
  labels:
    app.kubernetes.io/part-of: fiap-tech-challenge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: car-repair-shop-api
  minReplicas: 2
  # Measured against two t3.large: 46 free pod slots and 2260m requestable CPU.
  # Ten replicas fit with headroom for a 25% maxSurge rolling update.
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
