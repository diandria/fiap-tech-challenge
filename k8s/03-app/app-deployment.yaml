apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-repair-shop-api
  # The namespace is created by the infra-k8s Terraform, together with the
  # Service that anchors the NLB. Here it is only referenced.
  namespace: car-repair-shop
  labels:
    app: car-repair-shop-api
    app.kubernetes.io/name: car-repair-shop-api
    app.kubernetes.io/part-of: fiap-tech-challenge
    app.kubernetes.io/component: api
spec:
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: car-repair-shop-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        # `app: car-repair-shop-api` is not styling: it is the exact selector of
        # the Service that Terraform created. Diverging here produces an NLB with
        # no target, and the gateway answers 503 with nothing obviously broken in
        # the cluster.
        app: car-repair-shop-api
        app.kubernetes.io/name: car-repair-shop-api
        app.kubernetes.io/part-of: fiap-tech-challenge
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: api
        # Replaced at deploy time by `kubectl set image` with the SHA tag.
        # `latest` here is only a placeholder valid for kubeconform.
        image: car-repair-shop:latest
        imagePullPolicy: IfNotPresent
        # Removing the endpoint from the Service propagates asynchronously; the
        # delay keeps the pod accepting connections until traffic stops arriving.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        ports:
        - name: http
          containerPort: 3000
        envFrom:
        # Static, versioned in this repository.
        - configMapRef:
            name: car-repair-shop-config
        # Created by the CD from the Terraform outputs: Tempo address, SNS topic
        # ARN. Kept separate from the static one on purpose -- what comes from the
        # infrastructure changes with every recreated environment, and versioning
        # it would leave a value in the repository that no longer exists.
        - configMapRef:
            name: car-repair-shop-runtime
        - secretRef:
            name: car-repair-shop-secret
        # `requests` is not optional: the HPA computes utilization against it.
        # With no CPU request the autoscaler has no denominator and never scales.
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 24
          periodSeconds: 5
          timeoutSeconds: 5
        # Liveness does not query the database (M3.T7): restarting the pod does
        # not fix a database that is down, and the consequence would be a restart
        # loop during the incident.
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 5
