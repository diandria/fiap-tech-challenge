apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-repair-shop-api
  # O namespace e criado pelo Terraform do infra-k8s, junto do Service que
  # ancora o NLB. Aqui ele e apenas referenciado.
  namespace: car-repair-shop
  labels:
    app: car-repair-shop-api
    app.kubernetes.io/name: car-repair-shop-api
    app.kubernetes.io/part-of: fiap-tech-challenge
    app.kubernetes.io/component: api
spec:
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: car-repair-shop-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        # `app: car-repair-shop-api` nao e estilo: e o seletor exato do Service
        # que o Terraform criou. Divergir aqui produz um NLB sem destino, e o
        # gateway responde 503 sem nada obviamente quebrado no cluster.
        app: car-repair-shop-api
        app.kubernetes.io/name: car-repair-shop-api
        app.kubernetes.io/part-of: fiap-tech-challenge
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: api
        # Substituida no deploy por `kubectl set image` com a tag do SHA.
        # `latest` aqui e so um marcador valido para o kubeconform.
        image: car-repair-shop:latest
        imagePullPolicy: IfNotPresent
        # A remocao do endpoint do Service propaga de forma assincrona; o atraso
        # mantem o pod aceitando conexao ate o trafego parar de chegar.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        ports:
        - name: http
          containerPort: 3000
        envFrom:
        # Estatico, versionado neste repositorio.
        - configMapRef:
            name: car-repair-shop-config
        # Criado pelo CD a partir dos outputs do Terraform: endereco do Tempo,
        # ARN do topico SNS. Separado do estatico de proposito -- o que vem da
        # infraestrutura muda a cada ambiente recriado, e versiona-lo deixaria
        # no repositorio um valor que ja nao existe.
        - configMapRef:
            name: car-repair-shop-runtime
        - secretRef:
            name: car-repair-shop-secret
        # `requests` nao e opcional: o HPA calcula utilizacao contra ele. Sem
        # requests de CPU o autoscaler nao tem denominador e nunca escala.
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 24
          periodSeconds: 5
          timeoutSeconds: 5
        # Vivacidade nao consulta o banco (M3.T7): reiniciar o pod nao conserta
        # um banco fora, e a consequencia seria um laco de reinicios durante o
        # incidente.
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 5
