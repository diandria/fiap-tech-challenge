apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-repair-shop-api
  # Created by the infra-k8s Terraform, along with the Service anchoring the NLB.
  namespace: car-repair-shop
  labels:
    app: car-repair-shop-api
    app.kubernetes.io/name: car-repair-shop-api
    app.kubernetes.io/part-of: fiap-tech-challenge
    app.kubernetes.io/component: api
spec:
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: car-repair-shop-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        # Exact selector of the Terraform-created Service. Diverging leaves the
        # NLB with no target and the gateway answering 503.
        app: car-repair-shop-api
        app.kubernetes.io/name: car-repair-shop-api
        app.kubernetes.io/part-of: fiap-tech-challenge
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: api
        # Replaced at deploy time with the SHA tag; `latest` is a kubeconform
        # placeholder.
        image: car-repair-shop:latest
        imagePullPolicy: IfNotPresent
        # Endpoint removal propagates asynchronously; the delay keeps the pod
        # serving until traffic stops.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        ports:
        - name: http
          containerPort: 3000
        envFrom:
        # Static, versioned in this repository.
        - configMapRef:
            name: car-repair-shop-config
        # Written by the CD from Terraform outputs. Separate from the static one:
        # these change with every recreated environment.
        - configMapRef:
            name: car-repair-shop-runtime
        - secretRef:
            name: car-repair-shop-secret
        # Required by the HPA: with no CPU request there is no denominator.
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 24
          periodSeconds: 5
          timeoutSeconds: 5
        # Liveness does not query the database (M3.T7): restarting does not fix
        # a database that is down.
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 5
