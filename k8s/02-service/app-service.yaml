apiVersion: v1
kind: Service
metadata:
  name: car-repair-shop-api
  # The namespace is provisioned by the infra-k8s Terraform, as part of the
  # cluster environment. Everything that belongs to the application's own
  # lifecycle -- this Service included -- is versioned here.
  namespace: car-repair-shop
  labels:
    app: car-repair-shop-api
    app.kubernetes.io/name: car-repair-shop-api
    app.kubernetes.io/part-of: fiap-tech-challenge
    app.kubernetes.io/component: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    # Internal, never public: ADR-001 makes the API Gateway the single entry
    # point. A public NLB would bypass its throttling, CORS and auth.
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: "HTTP"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/health"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "3000"
spec:
  type: LoadBalancer
  # Set by the AWS Load Balancer Controller when it takes the balancer over.
  # Declaring it keeps a re-apply from reading the field as drift and
  # recreating the Service, which would recreate the NLB and change its DNS.
  loadBalancerClass: service.k8s.aws/nlb
  selector:
    app: car-repair-shop-api
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
