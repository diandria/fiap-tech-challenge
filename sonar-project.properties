sonar.projectKey=diandria_fiap-tech-challenge
sonar.projectName=Car Repair Shop API

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# O lcov ja e gerado pelo `npm run test:coverage` (jest.config.ts), entao a
# analise reaproveita a cobertura da suite em vez de recalcular por conta.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Artefatos de build e dependencias nao sao codigo do projeto. Sem estas
# exclusoes, o Sonar analisa o `dist/` e reporta os mesmos problemas duas vezes.
sonar.exclusions=dist/**,coverage/**,node_modules/**,prisma/migrations/**
