sonar.projectKey=diandria_fiap-tech-challenge
sonar.projectName=Car Repair Shop API

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# The lcov is already produced by `npm run test:coverage` (jest.config.ts), so
# the analysis reuses the suite's coverage instead of recomputing it.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Build artifacts and dependencies are not project code. Without these
# exclusions, Sonar analyses `dist/` and reports the same issues twice.
sonar.exclusions=dist/**,coverage/**,node_modules/**,prisma/migrations/**
