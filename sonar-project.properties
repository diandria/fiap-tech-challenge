sonar.projectKey=diandria_fiap-tech-challenge
sonar.projectName=Car Repair Shop API

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Reuses the lcov from `npm run test:coverage` instead of recomputing.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Without these, Sonar analyses `dist/` and reports every issue twice.
sonar.exclusions=dist/**,coverage/**,node_modules/**,prisma/migrations/**
