version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: car-repair-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: car_repair_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d car_repair_shop"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      JWT_SECRET: "dev-secret-change-in-prod"
      ADMIN_EMAIL: "admin@master.com"
      ADMIN_PASSWORD: "admin123"
      CORS_ORIGIN: "http://localhost:3000"
      DATABASE_URL: "postgresql://oficina:oficina@postgres:5432/car_repair_shop?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3


  sonar-db:
    image: postgres:15
    profiles: [sonar]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10-community
    profiles: [sonar]
    depends_on:
      - sonar-db
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    restart: unless-stopped

volumes:
  postgres-data:
  sonar_db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
