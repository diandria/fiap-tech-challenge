name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  coverage:
    name: Coverage
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 3
          if-no-files-found: error

  sonar:
    name: SonarQube
    needs: [build, test]
    runs-on: ubuntu-latest

    # Declared at the job level so the steps can branch on presence:
    # `secrets` is not available in a job's `if`, but `env` is.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      # Full history: without it Sonar cannot attribute authorship and loses
      # the notion of "new code", which is what its quality gates decide on.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The analysis reads the lcov; without running coverage first, Sonar
      # reports 0% and the quality gate fails for a reason that does not exist.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4

      # Warns instead of failing when the server is not configured. Failing
      # here would leave the CI red for a missing credential, and a CI that
      # lives red stops being read.
      - name: Report missing configuration
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::SONAR_TOKEN is not configured - SonarQube analysis skipped."
          echo "To enable it: set the SONAR_TOKEN and SONAR_HOST_URL secrets on the repository."

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manifests live in this repository, so linting them is this CI's
      # responsibility. It runs without a cluster, in seconds, and catches the
      # misspelled field that would otherwise only surface on the deploy's
      # `kubectl apply`.
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Validate
        run: kubeconform -strict -summary k8s/
