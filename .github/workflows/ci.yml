name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  coverage:
    name: Coverage
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 3
          if-no-files-found: error

  sonar:
    name: SonarQube
    needs: [build, test]
    runs-on: ubuntu-latest

    # Declarados no nivel do job para que os passos possam decidir por
    # presenca: `secrets` nao existe no `if` de um job, mas `env` existe.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      # Historico completo: sem ele o Sonar nao consegue atribuir autoria e
      # perde o conceito de "codigo novo", que e sobre o que os portoes de
      # qualidade dele decidem.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A analise le o lcov; sem rodar a cobertura antes, o Sonar reporta 0%
      # e o portao de qualidade reprova por um motivo que nao existe.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4

      # Avisa em vez de falhar quando o servidor nao esta configurado. Falhar
      # aqui deixaria o CI vermelho por falta de credencial, e um CI que vive
      # vermelho para de ser lido.
      - name: Report missing configuration
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::SONAR_TOKEN nao configurado — analise do SonarQube pulada."
          echo "Para habilitar: defina os secrets SONAR_TOKEN e SONAR_HOST_URL no repositorio."

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Os manifests moram neste repositorio, entao o lint deles e
      # responsabilidade deste CI. Roda sem cluster, em segundos, e pega o
      # campo escrito errado que so apareceria no `kubectl apply` do deploy.
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Validate
        run: kubeconform -strict -summary k8s/
