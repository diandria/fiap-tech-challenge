name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One deploy at a time. Without this, two consecutive merges compete for the
# same cluster and the second can overwrite the first mid-rollout.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    name: Build and push image
    # Hosted runner, not self-hosted: the local Phase 2 runner no longer exists,
    # and the workflows sat queued until they were cancelled.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Learner Lab credentials expire, and `sts get-caller-identity` keeps
      # answering after the session is revoked. A call that touches a real
      # resource is what reveals the expiry here, and not twenty minutes later
      # with a message that does not point at the cause.
      - name: Verify credentials are usable
        run: aws ec2 describe-vpcs --max-items 1 > /dev/null

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=${{ steps.ecr.outputs.registry }}/car-repair-shop" >> "$GITHUB_OUTPUT"

      # Tagged by SHA, not just `latest`. With `latest`, rollback is impossible
      # and a restarting pod may come back with a different image than the one
      # that was running -- a bug that is hard to diagnose exactly when there is
      # time pressure.
      #
      # The ECR repository is IMMUTABLE: pushing the same SHA twice fails,
      # instead of silently replacing the content.
      - name: Build and push
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}
          TAG: ${{ steps.meta.outputs.sha }}
        run: |
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

      - name: Confirm the image is in the registry
        env:
          TAG: ${{ steps.meta.outputs.sha }}
        run: |
          aws ecr describe-images \
            --repository-name car-repair-shop \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imagePushedAt' --output text

  deploy:
    name: Deploy to EKS
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Single environment: `main` is production, and there is no staging.
    # Declaring the Environment here is what makes GitHub record every deploy
    # under Deployments > production, with the history of who shipped what and
    # when. Without this line the Environment exists and is never used.
    #
    # No protection rule, on purpose: a required reviewer here would stall the
    # CD waiting for human approval, and this project's safety net is a
    # different one -- a required PR before the merge, and automatic rollback
    # after it. The URL comes from the deploy itself, and is not pinned here:
    # the environment is ephemeral and the gateway gets a new id on every
    # recreation. Pinning it would leave the Deployments link pointing at a
    # gateway that no longer exists.
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Connect to the cluster
        run: aws eks update-kubeconfig --name car-repair-shop --region us-east-1

      - name: Resolve image reference
        id: meta
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          REPO=$(aws ecr describe-repositories --repository-names car-repair-shop \
            --query 'repositories[0].repositoryUri' --output text)
          echo "image=$REPO" >> "$GITHUB_OUTPUT"

      # The secrets come from SSM, not from GitHub secrets.
      #
      # This is what eliminates risk R4 by construction: JWT_SECRET and
      # INTERNAL_TOKEN are written there by the functions' Terraform, and the
      # application reads the same parameter. There are no two values that could
      # diverge, so there is no hash to compare -- it is the same value, not two
      # equal ones.
      - name: Read configuration from SSM and AWS
        run: |
          set -euo pipefail

          DB_HOST=$(aws rds describe-db-instances --db-instance-identifier car-repair-shop-db \
            --query 'DBInstances[0].Endpoint.Address' --output text)
          # User and database name come from RDS itself, which is the
          # authoritative source. A hardcoded value here produces an invalid
          # DATABASE_URL and a CrashLoop whose cause is not visible in the
          # symptom.
          DB_USER=$(aws rds describe-db-instances --db-instance-identifier car-repair-shop-db \
            --query 'DBInstances[0].MasterUsername' --output text)
          DB_NAME=$(aws rds describe-db-instances --db-instance-identifier car-repair-shop-db \
            --query 'DBInstances[0].DBName' --output text)
          DB_PASS=$(aws ssm get-parameter --name /car-repair-shop/db/password \
            --with-decryption --query 'Parameter.Value' --output text)
          JWT=$(aws ssm get-parameter --name /car-repair-shop/auth/jwt-secret \
            --with-decryption --query 'Parameter.Value' --output text)
          INTERNAL=$(aws ssm get-parameter --name /car-repair-shop/auth/internal-token \
            --with-decryption --query 'Parameter.Value' --output text)
          # Without this password the application starts healthy, passes the
          # probes, and creates no user at all -- nobody can authenticate, and
          # the only signal is a log warning the green deploy does not show.
          ADMIN=$(aws ssm get-parameter --name /car-repair-shop/app/admin-password \
            --with-decryption --query 'Parameter.Value' --output text)
          TOPIC=$(aws sns list-topics \
            --query "Topics[?contains(TopicArn, 'car-repair-shop-service-order-events')].TopicArn | [0]" \
            --output text)

          # Fail here, and not later with a pod in CrashLoop whose cause is
          # three layers away from the symptom.
          for name in DB_HOST DB_USER DB_NAME DB_PASS JWT INTERNAL ADMIN TOPIC; do
            value="${!name}"
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "::error::required value missing or empty: $name"
              exit 1
            fi
          done

          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$JWT"
          echo "::add-mask::$INTERNAL"
          echo "::add-mask::$ADMIN"

          {
            echo "DATABASE_URL=postgresql://$DB_USER:$DB_PASS@$DB_HOST:5432/$DB_NAME?schema=public"
            echo "JWT_SECRET=$JWT"
            echo "INTERNAL_TOKEN=$INTERNAL"
            echo "ADMIN_PASSWORD=$ADMIN"
            echo "SNS_TOPIC_ARN=$TOPIC"
          } >> "$GITHUB_ENV"

      - name: Apply configuration and secrets
        run: |
          set -euo pipefail

          kubectl create configmap car-repair-shop-runtime -n car-repair-shop \
            --from-literal=NOTIFICATION_CHANNEL=sns \
            --from-literal=SNS_TOPIC_ARN="$SNS_TOPIC_ARN" \
            --from-literal=OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo.observability.svc.cluster.local:4318 \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic car-repair-shop-secret -n car-repair-shop \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=INTERNAL_TOKEN="$INTERNAL_TOKEN" \
            --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/01-config/ -f k8s/03-app/

      # A Job before the rollout, not an initContainer: it runs once, and a
      # failure is visible before any new pod takes traffic. With an
      # initContainer, every replica coming up would try to migrate in parallel.
      - name: Run database migrations
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}"

          # A Job is immutable: without deleting the previous one, apply fails.
          kubectl delete job car-repair-shop-migrate -n car-repair-shop --ignore-not-found --wait=true

          # The same image as the application. Migrating with an image other
          # than the one that will serve applies a schema the production code
          # may not know about.
          sed "s|image: car-repair-shop:latest|image: $IMAGE|" k8s/04-jobs/migrate.yaml \
            | kubectl apply -f -

          if ! kubectl wait --for=condition=complete --timeout=180s \
               job/car-repair-shop-migrate -n car-repair-shop; then
            echo "::error::migration failed; no new pod was deployed"
            kubectl logs job/car-repair-shop-migrate -n car-repair-shop --tail=50 || true
            exit 1
          fi

          kubectl logs job/car-repair-shop-migrate -n car-repair-shop --tail=20

      - name: Deploy the new image
        id: rollout
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}"

          kubectl set image deployment/car-repair-shop-api api="$IMAGE" -n car-repair-shop
          kubectl rollout status deployment/car-repair-shop-api -n car-repair-shop --timeout=300s

      # A rollback that works but leaves the workflow green is worse than no
      # rollback: the environment recovers and nobody finds out the deploy
      # failed. That is why this step ends with `exit 1` after undoing.
      - name: Roll back on failure
        if: failure() && steps.rollout.outcome == 'failure'
        run: |
          echo "::error::rollout failed; undoing to the previous revision"
          kubectl rollout undo deployment/car-repair-shop-api -n car-repair-shop
          kubectl rollout status deployment/car-repair-shop-api -n car-repair-shop --timeout=180s
          kubectl get pods -n car-repair-shop -o wide
          exit 1

      - name: Smoke check through the gateway
        id: smoke
        run: |
          set -euo pipefail
          URL=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='car-repair-shop'].ApiEndpoint | [0]" --output text)
          echo "gateway: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "health answered 200 through the gateway"
              exit 0
            fi
            echo "attempt $i: $code"
            sleep 10
          done

          echo "::error::the application did not answer 200 on /health through the gateway"
          exit 1
