name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Minikube
    runs-on: self-hosted
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    concurrency:
      group: deploy
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image tag from git SHA
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build image into Minikube Docker daemon
        run: |
          eval $(minikube docker-env)
          docker build -t fiap-tech-challenge:${{ steps.tag.outputs.sha }} .

      - name: Update image tag in Deployment manifest
        run: |
          sed -i "s|image: .*fiap-tech-challenge:.*|image: fiap-tech-challenge:${{ steps.tag.outputs.sha }}|" k8s/app-deployment.yaml
          grep -q "fiap-tech-challenge:${{ steps.tag.outputs.sha }}" k8s/app-deployment.yaml || (echo "ERROR: image tag not updated in manifest" && exit 1)

      - name: Initialize Terraform
        working-directory: infra/
        run: terraform init -input=false

      - name: Apply infrastructure with Terraform
        working-directory: infra/
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
          TF_VAR_mongo_root_username: ${{ secrets.MONGO_ROOT_USERNAME }}
          TF_VAR_mongo_root_password: ${{ secrets.MONGO_ROOT_PASSWORD }}

      - name: Verify database deployment
        run: kubectl rollout status statefulset/mongo -n oficina --timeout=180s

      - name: Verify application rollout
        run: kubectl rollout status deployment/oficina-app -n oficina --timeout=120s
