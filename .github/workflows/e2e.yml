name: BDD end-to-end

# Not a required check of main, on purpose: it builds Billing and Execution
# from their own main branches, and a break there must not block a pull
# request here. The result still shows on every pull request.
on:
  # No target-branch filter: a pull request stacked on another one runs too.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: BDD end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Side by side, as in ~/dev: the compose file builds the other two
      # services from ../fiap-tech-challenge-billing and -execution.
      - uses: actions/checkout@v4
        with:
          path: fiap-tech-challenge

      - uses: actions/checkout@v4
        with:
          repository: diandria/fiap-tech-challenge-billing
          path: fiap-tech-challenge-billing

      - uses: actions/checkout@v4
        with:
          repository: diandria/fiap-tech-challenge-execution
          path: fiap-tech-challenge-execution

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fiap-tech-challenge/package-lock.json

      - name: Start the three services
        working-directory: fiap-tech-challenge
        run: docker compose -f e2e/docker-compose.yml up --build -d --wait

      - name: Install dependencies
        working-directory: fiap-tech-challenge
        run: npm ci

      - name: Run the scenarios
        working-directory: fiap-tech-challenge
        run: npm run test:e2e

      # A timeout in a scenario says which state never arrived; the logs say
      # which service stopped the saga.
      - name: Collect the service logs
        if: failure()
        working-directory: fiap-tech-challenge
        run: docker compose -f e2e/docker-compose.yml logs --no-color > e2e-logs.txt

      - name: Upload the service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: fiap-tech-challenge/e2e-logs.txt
          retention-days: 7

      - name: Stop the stack
        if: always()
        working-directory: fiap-tech-challenge
        run: docker compose -f e2e/docker-compose.yml down -v
